name: Relances automatiques GAP

on:
  schedule:
    - cron: '0 7 * * *'  # Chaque jour à 8h (heure d'hiver) / 9h (heure d'été)
  workflow_dispatch:       # Permet aussi de lancer manuellement

permissions:
  contents: read

jobs:
  envoyer-relances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Envoyer les relances et purger les anciennes données
        run: node scripts/relances.js
        env:
          # Clé "service_role" Supabase, à enregistrer dans
          # Settings > Secrets and variables > Actions > SB_SERVICE_KEY
          SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}
